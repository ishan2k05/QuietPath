services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quietpath_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=sqlite:///./quietpath.db
      - SECRET_KEY=quietpath-super-secret-prod-token-key-change-in-env
      - CORS_ORIGINS=*
    volumes:
      - quietpath_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  quietpath_data:
